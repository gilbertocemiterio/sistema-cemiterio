<!DOCTYPE html>
<html>
<head>
    <title>Controle de Sepultamentos - Paranavai</title>
    <meta charset="iso-8859-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #F5F7FA; color: #333; }
        .topo { background-color: #1F4E79; color: white; padding: 12px; text-align: center; }
        .titulo { font-size: 15px; font-weight: bold; margin: 0; }
        .busca-container { margin-top: 8px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .busca-container input { padding: 6px; font-size: 14px; text-align: center; width: 110px; border-radius: 4px; border: none; font-weight: bold; }
        .relogio-container { font-family: monospace; font-size: 15px; font-weight: bold; color: #00FFCC; margin-top: 4px; }
        button { padding: 6px 12px; font-size: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .btn-buscar { background-color: #DDEBF7; color: #1F4E79; }
        
        .calendario-card { background: white; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 10px; margin: 10px; }
        .cal-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: #1F4E79; color: white; padding: 4px 8px; border-radius: 4px; }
        .cal-topo button { background: #153654; color: white; padding: 2px 6px; font-size: 13px; }
        .cal-mes-ano { font-weight: bold; font-size: 12px; }
        .cal-grade { display: table; width: 100%; table-layout: fixed; text-align: center; }
        .cal-linha { display: table-row; }
        .cal-cabecalho { display: table-cell; font-weight: bold; font-size: 10px; padding: 3px 0; background: #EEE; border: 1px solid #DDD; color: #555; }
        .cal-dia { display: table-cell; padding: 6px 0; font-size: 11px; border: 1px solid #EEE; cursor: pointer; font-weight: bold; color: #333; }
        .cal-dia:hover { background: #DDEBF7; }
        .cal-dia-vazio { display: table-cell; background: #FAFAFA; border: 1px solid #F5F5F5; }
        .cal-dia-selecionado { background: #1F4E79 !important; color: white !important; border: 1px solid #1F4E79; }
        .cal-dia-hoje { border: 2px solid #2E7D32; color: #2E7D32; }

        .corpo-principal { padding: 0 10px 15px 10px; }
        .card { background: white; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 12px; margin-bottom: 12px; }
        .titulo-central { color: #1F4E79; border-bottom: 2px solid #1F4E79; padding-bottom: 4px; margin-top: 0; font-size: 14px; }
        .titulo-recanto { color: #2E7D32; border-bottom: 2px solid #2E7D32; padding-bottom: 4px; margin-top: 0; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: fixed; }
        th, td { border: 1px solid #D9D9D9; padding: 6px; text-align: left; font-size: 11px; word-wrap: break-word; }
        th { background-color: #F2F2F2; font-weight: bold; }
        .status-livre { background-color: #E2EFDA; color: #385723; font-weight: bold; text-align: center; }
        .status-reservado { background-color: #FCE4D6; color: #C00000; font-weight: bold; text-align: center; }
        .linha-almoco { background-color: #F2F2F2; color: #7F8C8D; font-style: italic; text-align: center; }
        .info-nome { font-size: 13px; font-weight: bold; color: #111; display: block; margin-bottom: 3px; }
        .info-detalhes { font-size: 11px; color: #333; line-height: 1.3; }
        .info-gravado { font-size: 10px; color: #C00000; font-style: italic; display: block; margin-top: 2px; }
    </style>
</head>
<body onload="initApp()">

    <div class="topo">
        <div class="titulo">ADMINISTRACAO DE CEMITERIOS</div>
        <div class="busca-container">
            <input type="text" id="txtData" maxlength="10" />
            <button class="btn-buscar" onclick="pedirAtualizacaoNuvem()">Atualizar</button>
        </div>
        <div id="txtRelogio" class="relogio-container">00:00:00</div>
    </div>

    <div class="calendario-card">
        <div class="cal-topo">
            <button onclick="mudarMes(-1)">&lt;</button>
            <div id="calMesAno" class="cal-mes-ano">Julho de 2026</div>
            <button onclick="mudarMes(1)">&gt;</button>
        </div>
        <div id="calendarioGrade" class="cal-grade"></div>
    </div>

    <div class="corpo-principal">
        <div class="card">
            <h3 class="titulo-central">CEMITERIO MUNICIPAL CENTRAL</h3>
            <div id="containerCentral"></div>
        </div>
        <div class="card">
            <h3 class="titulo-recanto">PARQUE RECANTO DA SAUDADE</h3>
            <div id="containerRecanto"></div>
        </div>
    </div>

    <script type="text/javascript">
        var horariosCentral = ["08:00", "09:00", "10:00", "13:00", "14:00", "15:00", "16:00"];
        var horariosRecanto = ["08:00", "09:00", "10:00", "13:30", "14:20", "15:10", "15:45"];
        var nomesMeses = ["Janeiro", "Fevereiro", "Marco", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        var dataCalendarioAtual = new Date();

        function formatarDoisDigitos(n) { return (n < 10 ? '0' : '') + n; }

        function initApp() {
            var hoje = new Date();
            document.getElementById("txtData").value = formatarDoisDigitos(hoje.getDate()) + "/" + formatarDoisDigitos(hoje.getMonth() + 1) + "/" + hoje.getFullYear();

            setInterval(function() {
                var agora = new Date();
                document.getElementById("txtRelogio").innerText = formatarDoisDigitos(agora.getHours()) + ":" + formatarDoisDigitos(agora.getMinutes()) + ":" + formatarDoisDigitos(agora.getSeconds());
            }, 1000);

            renderizarCalendarioLayout();
            pedirAtualizacaoNuvem();
        }

        function mudarMes(direcao) {
            dataCalendarioAtual.setMonth(dataCalendarioAtual.getMonth() + direcao);
            renderizarCalendarioLayout();
        }

        function selecionarDataCalendario(dia, mes, ano) {
            document.getElementById("txtData").value = formatarDoisDigitos(dia) + "/" + formatarDoisDigitos(mes) + "/" + ano;
            renderizarCalendarioLayout();
            pedirAtualizacaoNuvem();
        }

        function renderizarCalendarioLayout() {
            var mes = dataCalendarioAtual.getMonth(), ano = dataCalendarioAtual.getFullYear();
            document.getElementById("calMesAno").innerText = nomesMeses[mes] + " de " + ano;
            var dataCorrente = document.getElementById("txtData").value.trim();
            var hoje = new Date();
            var primeiroDiaSemana = new Date(ano, mes, 1).getDay(), totalDiasMes = new Date(ano, mes + 1, 0).getDate();

            var html = "<div class='cal-linha'>";
            var diasSemana = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"];
            for (var i = 0; i < 7; i++) html += "<div class='cal-cabecalho'>" + diasSemana[i] + "</div>";
            html += "</div><div class='cal-linha'>";

            var colunaConta = 0;
            for (var i = 0; i < primeiroDiaSemana; i++) { html += "<div class='cal-dia-vazio'></div>"; colunaConta++; }

            for (var diaItem = 1; diaItem <= totalDiasMes; diaItem++) {
                if (colunaConta === 7) { html += "</div><div class='cal-linha'>"; colunaConta = 0; }
                var strDataItem = formatarDoisDigitos(diaItem) + "/" + formatarDoisDigitos(mes + 1) + "/" + ano;
                var classeEstilo = "cal-dia";
                if (strDataItem === dataCorrente) classeEstilo += " cal-dia-selecionado";
                if (diaItem === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear()) classeEstilo += " cal-dia-hoje";
                
                html += "<div class='" + classeEstilo + "' onclick='selecionarDataCalendario(" + diaItem + "," + (mes + 1) + "," + ano + ")'>" + diaItem + "</div>";
                colunaConta++;
            }
            while (colunaConta < 7) { html += "<div class='cal-dia-vazio'></div>"; colunaConta++; }
            html += "</div>";
            document.getElementById("calendarioGrade").innerHTML = html;
        }

        function pedirAtualizacaoNuvem() {
            var dataSelecionada = document.getElementById("txtData").value.trim();
            if (window.AppInventor) {
                // Solicita ao MIT App Inventor que busque a API passando a data atual
                window.AppInventor.setWebViewString(dataSelecionada);
            } else {
                // Modo navegador web comum (computador/site)
                fetch('/api/agendamentos?data=' + encodeURIComponent(dataSelecionada))
                    .then(response => response.json())
                    .then(data => processarDadosEAtualizar(data))
                    .catch(err => console.error("Erro ao buscar dados:", err));
            }
        }

        // Chamado pelo App Inventor quando ele recebe o JSON da nuvem
        function atualizarTela() {
            if (window.AppInventor) {
                var jsonTexto = window.AppInventor.getWebViewString();
                if (jsonTexto && jsonTexto.trim() !== "" && jsonTexto !== "ATUALIZAR") {
                    try {
                        var dadosJson = JSON.parse(jsonTexto);
                        processarDadosEAtualizar(dadosJson);
                    } catch(e) {
                        console.error("Erro ao interpretar JSON do App Inventor:", e);
                    }
                }
            }
        }

        function processarDadosEAtualizar(registros) {
            var agendamentos = { "Central": {}, "Recanto": {} };

            if (Array.isArray(registros)) {
                for (var i = 0; i < registros.length; i++) {
                    var obj = registros[i];
                    var cemOriginal = obj.cem ? obj.cem.trim() : "";
                    var cemChave = "";
                    if (cemOriginal.toLowerCase().indexOf("central") !== -1) cemChave = "Central";
                    if (cemOriginal.toLowerCase().indexOf("recanto") !== -1) cemChave = "Recanto";

                    if (cemChave !== "") {
                        var horaRegistro = obj.hora ? obj.hora.trim() : "00:00";
                        agendamentos[cemChave][horaRegistro] = obj;
                    }
                }
            }

            renderizarTabela("containerCentral", horariosCentral, agendamentos["Central"], "11h-13h");
            renderizarTabela("containerRecanto", horariosRecanto, agendamentos["Recanto"], "11h-13h30");
        }

        function renderizarTabela(idContainer, listaHorariosPadrao, dadosCem, rotuloAlmoco) {
            var html = "<table>";
            html += "<tr><th style='width:50px; text-align:center;'>Hora</th><th style='width:75px; text-align:center;'>Status</th><th>Detalhes</th></tr>";
            
            var todosHorarios = [].concat(listaHorariosPadrao);
            for (var h in dadosCem) {
                if (dadosCem.hasOwnProperty(h) && todosHorarios.indexOf(h) === -1) {
                    todosHorarios.push(h);
                }
            }
            todosHorarios.sort();
            var almocoRenderizado = false;

            for (var i = 0; i < todosHorarios.length; i++) {
                var hora = todosHorarios[i];
                if (!almocoRenderizado && hora > "10:00") {
                    html += "<tr><td style='text-align:center; font-weight:bold;'>" + rotuloAlmoco + "</td><td colspan='2' class='linha-almoco'>ALMOCO</td></tr>";
                    almocoRenderizado = true;
                }

                if (dadosCem[hora]) {
                    var ag = dadosCem[hora];
                    var detalhesHtml = "<span class='info-nome'>" + (ag.falecido || "NÃO INFORMADO") + "</span>" +
                                       "<span class='info-detalhes'>" +
                                       "Lote: " + (ag.lote || "-") + "<br>" +
                                       "Resp: " + (ag.resp || "-") + " | Tel: " + (ag.tel || "-") + "<br>" +
                                       "Funerária: " + (ag.funeraria || "-");
                    
                    if (ag.estcivil && ag.estcivil !== "-0" && ag.estcivil !== "-") detalhesHtml += "<br>Estado Civil: " + ag.estcivil;
                    if (ag.parentesco && ag.parentesco !== "-") detalhesHtml += " | Parentesco: " + ag.parentesco;
                    if (ag.endereco && ag.endereco !== "-") detalhesHtml += "<br>Endereço: " + ag.endereco;
                    if (ag.cpf && ag.cpf !== "-0" && ag.cpf !== "-") detalhesHtml += "<br>CPF: " + ag.cpf;
                    if (ag.datacriacao && ag.datacriacao !== "-") {
                        detalhesHtml += "<span class='info-gravado'>Gravado em: " + ag.datacriacao + "</span>";
                    }

                    detalhesHtml += "</span>";

                    html += "<tr><td style='text-align:center; font-weight:bold;'>" + hora + "</td>";
                    html += "<td class='status-reservado'>RESERVADO</td>";
                    html += "<td>" + detalhesHtml + "</td></tr>";
                } else {
                    html += "<tr><td style='text-align:center; font-weight:bold;'>" + hora + "</td><td class='status-livre'>LIVRE</td><td style='color:#999; text-align:center;'>-</td></tr>";
                }
            }
            html += "</table>";
            document.getElementById(idContainer).innerHTML = html;
        }
    </script>
</body>
</html>
