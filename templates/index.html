<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Agendamentos - Cemitério</title>
    <style>
        /* --- ESTILO PADRÃO (Focado para Celular / Telas Pequenas) --- */
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 10px;
            margin: 0;
            background-color: #ffffff;
            color: #333;
        }

        .container {
            width: 100%;
            margin: 0 auto;
        }

        /* --- ESTILO PARA COMPUTADORES (Telas maiores que 768px) --- */
        @media screen and (min-width: 768px) {
            body {
                font-size: 16px;
                padding: 20px;
                background-color: #f4f6f9;
            }

            .container {
                max-width: 1100px;
                background: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <!-- BOTÃO DE MODO ADMINISTRADOR NO TOPO -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>Consulta de Agendamentos</h2>
        <button onclick="abrirModalLogin()" style="background: #004080; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            🔐 Modo Administrador
        </button>
    </div>

    <div class="container">
        <!-- O restante do conteúdo visual da sua agenda pública continua aqui -->
        <p>Esta é a página de visualização pública. Para cadastrar, editar ou excluir, acesse o Modo Administrador.</p>
    </div>

    <!-- MODAL DE LOGIN DO ADMINISTRADOR -->
    <div id="modalLogin" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9999;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <h3>Área Restrita</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Digite a senha de administrador:</p>
            <input type="password" id="senhaAdmin" placeholder="Senha" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <br>
            <button onclick="fazerLogin()" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Entrar</button>
            <button onclick="fecharModalLogin()" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;">Cancelar</button>
        </div>
    </div>

    <script>
        function abrirModalLogin() {
            document.getElementById('modalLogin').style.display = 'flex';
        }

        function fecharModalLogin() {
            document.getElementById('modalLogin').style.display = 'none';
            document.getElementById('senhaAdmin').value = '';
        }

        function fazerLogin() {
            const senha = document.getElementById('senhaAdmin').value;
            
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senha: senha })
            })
            .then(response => response.json())
            .then(data => {
                if (data.sucesso) {
                    window.location.href = '/admin';
                } else {
                    alert(data.erro || 'Senha incorreta!');
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                alert('Erro ao tentar fazer login.');
            });
        }
    </script>
</body>
</html>
