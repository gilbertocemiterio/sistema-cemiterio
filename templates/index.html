<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Sepultamentos - Consulta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 10px;
            margin: 0;
            background-color: #ffffff;
            color: #333;
        }
        .container {
            width: 100%;
            margin: 0 auto;
        }
        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #004080;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .relogio {
            font-size: 18px;
            font-weight: bold;
            background: #00264d;
            padding: 5px 10px;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #004080;
            color: white;
        }
        @media screen and (min-width: 768px) {
            body {
                font-size: 16px;
                padding: 20px;
                background-color: #f4f6f9;
            }
            .container {
                max-width: 1100px;
                background: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOPO COM TÍTULO, RELÓGIO E BOTÃO ADMIN -->
        <div class="topo">
            <div>
                <h2 style="margin: 0;">ADMINISTRAÇÃO DE CEMITÉRIOS</h2>
                <div id="dataAtual" style="font-size: 14px; margin-top: 5px;"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="relogio" class="relogio">00:00:00</div>
                <button onclick="abrirModalLogin()" style="background: #ffffff; color: #004080; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    🔐 Administrador
                </button>
            </div>
        </div>

        <!-- FILTRO DE DATA -->
        <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
            <label for="dataFiltro"><strong>Data Selecionada:</strong></label>
            <input type="date" id="dataFiltro" onchange="carregarAgendamentos()" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <!-- TABELA DE HORÁRIOS -->
        <table id="tabelaAgendamentos">
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Status</th>
                    <th>Detalhes / Falecido</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="3" style="text-align: center;">Carregando agendamentos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- MODAL DE LOGIN DO ADMINISTRADOR -->
    <div id="modalLogin" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9999;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <h3>Área Restrita</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Digite a senha de administrador:</p>
            <input type="password" id="senhaAdmin" placeholder="Senha" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <br>
            <button onclick="fazerLogin()" style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Entrar</button>
            <button onclick="fecharModalLogin()" style="background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;">Cancelar</button>
        </div>
    </div>

    <script>
        // Inicializa relógio, data e busca dados ao carregar a página
        document.addEventListener("DOMContentLoaded", () => {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dataFiltro').value = hoje;
            
            atualizarRelogio();
            setInterval(atualizarRelogio, 1000);
            
            carregarAgendamentos();
        });

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
            document.getElementById('dataAtual').innerText = agora.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function carregarAgendamentos() {
            const dataSelecionada = document.getElementById('dataFiltro').value;
            
            fetch(`/api/agendamentos?data=${dataSelecionada}`)
                .then(response => response.json())
                .then(dados => {
                    const tbody = document.querySelector('#tabelaAgendamentos tbody');
                    tbody.innerHTML = '';

                    if (dados.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #666;">Nenhum agendamento registrado para esta data.</td></tr>';
                        return;
                    }

                    dados.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="font-weight: bold; width: 100px;">${item.hora || ''}</td>
                            <td style="width: 120px;"><span style="color: red; font-weight: bold;">RESERVADO</span></td>
                            <td>
                                <strong>Falecido(a):</strong> ${item.falecido || 'Não informado'}<br>
                                <span style="font-size: 12px; color: #555;">Cemitério: ${item.cem || ''} | Lote: ${item.lote || ''} | Funerária: ${item.funeraria || ''}</span>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error('Erro ao carregar:', err);
                });
        }

        function abrirModalLogin() {
            document.getElementById('modalLogin').style.display = 'flex';
        }

        function fecharModalLogin() {
            document.getElementById('modalLogin').style.display = 'none';
            document.getElementById('senhaAdmin').value = '';
        }

        function fazerLogin() {
            const senha = document.getElementById('senhaAdmin').value;
            
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senha: senha })
            })
            .then(response => response.json())
            .then(data => {
                if (data.sucesso) {
                    window.location.href = '/admin';
                } else {
                    alert(data.erro || 'Senha incorreta!');
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                alert('Erro ao tentar fazer login.');
            });
        }
    </script>
</body>
</html>
